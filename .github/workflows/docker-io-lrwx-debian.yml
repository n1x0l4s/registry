name: Build and Push Debian

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    paths:
      - 'docker.io/lrwx/debian/**'
      - '.github/workflows/docker-io-lrwx-debian.yml'
  pull_request:
    paths:
      - 'docker.io/lrwx/debian/**'
      - '.github/workflows/docker-io-lrwx-debian.yml'
  workflow_dispatch:
    inputs:
      FLAVOUR:
        description: 'Debian image flavour'
        required: false
        default: 'runtime'
        type: choice
        options:
          - 'runtime'
          - 'baremin'
          - 'develop'
      TZ:
        description: 'Timezone (TZ)'
        required: false
        default: 'Asia/Shanghai'
        type: choice
        options:
          - 'Asia/Shanghai'
          - 'UTC'
          - 'America/Los_Angeles'
          - 'America/New_York'
      RELEASE:
        description: 'Upstream release tag'
        required: false
        default: 'stable'
        type: string
      APT_MIRROR:
        description: 'APT mirror'
        required: false
        default: 'deb.debian.org'
        type: string
      EXTRA_PKG:
        description: 'Additional APT packages to install'
        required: false
        default: ''
        type: string
      EXTRA_TAG:
        description: 'Additional image tag'
        required: false
        default: ''
        type: string

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Populate default input variables
        id: env
        run: |
          {
          FLAVOUR=${{github.event.inputs.FLAVOUR||'runtime'}}
          echo "FLAVOUR=${FLAVOUR}"

          TZ=${{github.event.inputs.TZ||'Asia/Shanghai'}}
          echo "TZ=${TZ}"

          APT_MIRROR="${{github.event.inputs.APT_MIRROR||'deb.debian.org'}}"
          echo "APT_MIRROR=${APT_MIRROR}"

          RELEASE="${{github.event.inputs.APT_MIRROR}}"
          EXTRA_PKG="${{github.event.inputs.EXTRA_PKG}}"
          case "${FLAVOUR}" in
          (*"runtime"*) RELEASE="${RELEASE:-stable}"
          EXTRA_PKG="${EXTRA_PKG} nvi file iproute2 curl" ;;
          (*"develop"*) RELEASE="${RELEASE:-sid}"
          EXTRA_PKG="${EXTRA_PKG} nmap libssl-dev build-essential pkg-config"
          EXTRA_PKG="${EXTRA_PKG} git yq neovim file iproute2 curl" ;;
          (*) RELEASE="${RELEASE:-stable}" ;; esac
          echo "RELEASE=${RELEASE}"
          echo "EXTRA_PKG=${EXTRA_PKG}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up multiarch support
        uses: docker/setup-qemu-action@v4

      - name: Set up container builder
        uses: docker/setup-buildx-action@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: lrwx/debian
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{steps.env.outputs.FLAVOUR}}
            type=raw,value=git-{{commit_date 'YYYYMMDDHHmmss' tz='${{steps.env.outputs.TZ}}'}}
            type=raw,value={{date 'YYYYMMDDHHmmss' tz='${{steps.env.outputs.TZ}}'}}
            type=raw,value=${{github.event.inputs.EXTRA_TAG}},enable=${{github.event.inputs.EXTRA_TAG != ''}}

      - name: Build and push container image
        uses: docker/build-push-action@v7
        with:
          context: ./docker.io/lrwx/debian
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{github.event_name != 'pull_request'}}
          provenance: false
          tags: ${{steps.meta.outputs.tags}}
          labels: ${{steps.meta.outputs.labels}}
          annotations: ${{steps.meta.outputs.annotations}}
          build-args: |
            RELEASE=${{steps.env.outputs.RELEASE}}
            TZ=${{steps.env.outputs.TZ}}
            APT_MIRROR=${{steps.env.outputs.APT_MIRROR}}
            EXTRA_PKG=${{steps.env.outputs.EXTRA_PKG}}
          cache-from: type=gha
          cache-to: type=gha,mode=max
