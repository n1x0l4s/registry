name: Build and Push Java

on:
  schedule:
    - cron: '0 1 * * *'
  push:
    paths:
      - 'docker.io/lrwx/java/**'
      - '.github/workflows/docker-io-lrwx-java.yml'
  pull_request:
    paths:
      - 'docker.io/lrwx/java/**'
      - '.github/workflows/docker-io-lrwx-java.yml'
  workflow_dispatch:
    inputs:
      MAJOR:
        description: 'Java Major Version (e.g. 11, 17, or "lts")'
        required: false
        default: 'lts'
        type: string
      FLAVOUR:
        description: 'Target bundle flavour'
        required: false
        default: 'jre'
        type: choice
        options:
          - 'jre'
          - 'jdk'
      JAVA_MODULES:
        description: 'Extra comma-separated Java modules not in JRE'
        required: false
        default: ''
        type: string
      BASE_TAG:
        description: 'lrwx/debian base image tag'
        required: false
        default: ''
        type: string
      JLINK_ARGS:
        description: 'Additional arguments for jlink'
        required: false
        default: ''
        type: string
      EXTRA_TAG:
        description: 'Additional image tag'
        required: false
        default: ''
        type: string

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Populate default input variables
        id: env
        run: |
          {
          MAJOR="${{github.event.inputs.MAJOR||'lts'}}"
          URL="https://api.adoptium.net/v3/info/available_releases"
          if [ "${MAJOR}" = "lts" ] || [ -z "${MAJOR}" ]; then
            MAJOR=$(curl -sfL "${URL}" | jq -r '.most_recent_lts // empty')
          fi
          [ "${MAJOR}" -gt 7 ] || MAJOR=8
          echo "MAJOR=${MAJOR}"

          FLAVOUR=${{github.event.inputs.FLAVOUR||'jre'}}
          echo "FLAVOUR=${FLAVOUR}"

          _IMG_PFX="eclipse-temurin:${MAJOR}"
          JAVA_MODULES=$(printf '%s,%s' "${{github.event.inputs.JAVA_MODULES}}" \
          "$(docker run --rm --net=none ${_IMG_PFX}-jre java --list-modules | \
          cut -d'@' -f1)" | awk -v all="$(docker run --rm --net=none \
          ${_IMG_PFX}-jdk java --list-modules | cut -d'@' -f1)" \
          ' BEGIN {
              RS = "[,[:space:]]+"
              n = split(all, a, "\n")
              for (i = 1; i <= n; i++) if (a[i] != "") valid[a[i]] = 1
            }
            NF {
              if (seen[$0]++) next
              if ($0 in valid) {
                out = (out == "" ? "" : out ",") $0
              } else {
                print "WARN: " $0 " not provided by JDK (skip)." > "/dev/stderr"
              }
            }
            END { print out }
          ')
          if [ -z "${JAVA_MODULES}" ]; then
            echo "ERR: No valid modules found for JDK ${_MAJOR}." >&2
            exit 1
          fi
          echo "JAVA_MODULES=${JAVA_MODULES}"

          BASE_TAG="${{github.event.inputs.BASE_TAG}}"
          RUN_USER="java"
          if [ -z "${BASE_TAG}" ] || [ "${BASE_TAG}" = "null" ]; then
            case "${FLAVOUR}" in
            ("jdk")  BASE_TAG="develop"; RUN_USER="root" ;;
            (*) BASE_TAG="runtime" ;; esac
          fi
          echo "BASE_TAG=${BASE_TAG}"
          echo "RUN_USER=${RUN_USER}"

          JLINK_ARGS="${{github.event.inputs.JLINK_ARGS||''}}"
          if [ -z "${JLINK_ARGS}"]; then JLINK_ARGS="--compress 2"
          JLINK_ARGS="${JLINK_ARGS} --strip-debug"
          JLINK_ARGS="${JLINK_ARGS} --no-man-pages"
          JLINK_ARGS="${JLINK_ARGS} --no-header-files"
          fi
          echo "JLINK_ARGS=${JLINK_ARGS}"

          echo "TZ=$(docker run --rm lrwx/debian:${BASE_TAG} cat /etc/timezone \
          || echo 'Asia/Shanghai')"

          } >> "${GITHUB_OUTPUT}"

      - name: Set up multiarch support
        uses: docker/setup-qemu-action@v4

      - name: Set up container builder
        uses: docker/setup-buildx-action@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: lrwx/java
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{steps.env.outputs.FLAVOUR}}
            type=raw,value=${{steps.env.outputs.FLAVOUR}}-${{steps.env.outputs.MAJOR}}
            type=raw,value=git-{{commit_date 'YYYYMMDDHHmmss' tz='${{steps.env.outputs.TZ}}'}}
            type=raw,value={{date 'YYYYMMDDHHmmss' tz='${{steps.env.outputs.TZ}}'}}
            type=raw,value=${{github.event.inputs.EXTRA_TAG}},enable=${{github.event.inputs.EXTRA_TAG != ''}}


      - name: Build and push container image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker.io/lrwx/java/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{github.event_name != 'pull_request'}}
          provenance: false
          tags: ${{steps.meta.outputs.tags}}
          labels: ${{steps.meta.outputs.labels}}
          annotations: ${{steps.meta.outputs.annotations}}
          build-args: |
            BASE_TAG=${{steps.env.outputs.BASE_TAG}}
            MAJOR=${{steps.env.outputs.MAJOR}}
            FLAVOUR=${{steps.env.outputs.FLAVOUR}}
            JAVA_MODULES=${{steps.env.outputs.JAVA_MODULES}}
            RUN_USER=${{steps.env.outputs.RUN_USER}}
            JLINK_ARGS=${{steps.env.outputs.JLINK_ARGS}}
          cache-from: type=gha
          cache-to: type=gha,mode=max
